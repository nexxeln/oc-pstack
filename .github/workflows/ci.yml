name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: port is reproducible
        run: bun run port && git diff --exit-code -- skills agents
      - run: bun run typecheck
      - run: bun run test
